// Spouse display helper (avoids IIFE in JSX)
function SpouseDisplay({ m, members }) {
  if (!m.maritalStatus || m.maritalStatus === "single" || m.maritalStatus === "widowed" || m.maritalStatus === "divorced") {
    return <p>—</p>;
  }
  if (m.spouseMemberId) {
    const sp = members.find(x => x.id === m.spouseMemberId);
    if (sp) return <p><span style={{color:"var(--gold)"}}>{sp.firstName} {sp.lastName}</span> <span style={{fontSize:".68rem",color:"var(--green)"}}>✅ member</span></p>;
  }
  if (m.spouseName) return <p>{m.spouseName}</p>;
  return <p>—</p>;
}

// ─── SEARCHABLE SELECT ────────────────────────────────────────────────────────
// Generic searchable dropdown used for member/district/group pickers
function SearchableSelect({ value, onChange, options, placeholder="Search…", renderOption, renderValue, onClear }) {
  const [open, setOpen] = useState(false);
  const [q, setQ] = useState("");
  const ref = useRef();

  useEffect(() => {
    const handler = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown", handler);
    return () => document.removeEventListener("mousedown", handler);
  }, []);

  const filtered = q.trim()
    ? options.filter(o => (o.label||"").toLowerCase().includes(q.toLowerCase()) || (o.sub||"").toLowerCase().includes(q.toLowerCase()))
    : options;

  const selected = options.find(o => o.value === value);

  return (
    <div className="ss-wrap" ref={ref}>
      <div className="ss-input-row">
        <input
          value={open ? q : (selected ? (renderValue ? renderValue(selected) : selected.label) : "")}
          onChange={e => { setQ(e.target.value); setOpen(true); }}
          onFocus={() => { setQ(""); setOpen(true); }}
          placeholder={placeholder}
          readOnly={!open}
          style={{cursor: open?"text":"pointer"}}
        />
        <button className="ss-btn" type="button" onClick={() => { setOpen(o=>!o); setQ(""); }}>🔍</button>
      </div>
      {open && (
        <div className="ss-dropdown">
          {filtered.length ? filtered.map(o => (
            <div key={o.value} className={`ss-item${value===o.value?" active":""}`} onClick={() => { onChange(o.value); setOpen(false); setQ(""); }}>
              {renderOption ? renderOption(o) : <span>{o.label}</span>}
            </div>
          )) : <div className="ss-empty">No results for "{q}"</div>}
          {value && onClear && <div className="ss-clear" onClick={() => { onClear(); setOpen(false); setQ(""); }}>✕ Clear selection</div>}
        </div>
      )}
    </div>
  );
}

// Member picker — wraps SearchableSelect with member-specific rendering
function MemberPicker({ members, value, onChange, placeholder="Search member…", onClear }) {
  const options = members.map(m => ({
    value: m.id,
    label: `${m.firstName} ${m.otherNames?m.otherNames+" ":""}${m.lastName}`,
    sub: m.nationalId,
    isFull: m.isFull,
    m,
  }));
  return (
    <SearchableSelect
      value={value} onChange={onChange} options={options}
      placeholder={placeholder} onClear={onClear}
      renderValue={o => o.label}
      renderOption={o => (
        <>
          <div style={{width:26,height:26,borderRadius:"50%",background:avatarColor(o.m.id),display:"flex",alignItems:"center",justifyContent:"center",fontSize:".62rem",fontFamily:"Cormorant Garamond,serif",fontWeight:700,color:"#fff",flexShrink:0}}>{initials(o.m)}</div>
          <div style={{flex:1}}>
            <div style={{fontSize:".83rem"}}>{o.label}</div>
            <div style={{fontSize:".68rem",color:"var(--muted)"}}>{o.sub}</div>
          </div>
          <span className={`ss-badge badge ${o.isFull?"badge-full":"badge-assoc"}`}>{o.isFull?"Full":"Assoc."}</span>
        </>
      )}
    />
  );
}

// District picker
function DistrictPicker({ districts, value, onChange, onClear }) {
  const options = districts.map(d => ({ value: d.id, label: d.name }));
  return (
    <SearchableSelect value={value} onChange={onChange} options={options}
      placeholder="Search district…" onClear={onClear}
      renderOption={o => <span>🗺 {o.label}</span>}
    />
  );
}

// Spouse field — search existing members OR free-type a name
function SpouseField({ members, spouseMemberId, spouseName, onChange }) {
  const [mode, setMode] = useState(spouseMemberId ? "member" : "text");
  const linked = members.find(x => x.id === spouseMemberId);

  const handleModeChange = (newMode) => {
    setMode(newMode);
    onChange({ spouseMemberId: "", spouseName: "" });
  };

  return (
    <div>
      <div style={{display:"flex",gap:12,marginBottom:7}}>
        {[["member","🔗 Link to member"],["text","✏️ Type name manually"]].map(([val,label]) => (
          <label key={val} style={{display:"flex",gap:5,alignItems:"center",fontSize:".75rem",textTransform:"none",cursor:"pointer",color:mode===val?"var(--gold)":"var(--muted)"}}>
            <input
              type="radio"
              name={"spouseMode_"+Math.random().toString(36).slice(2)}
              checked={mode===val}
              onChange={() => handleModeChange(val)}
              style={{width:"auto",accentColor:"var(--gold)"}}
            />
            {label}
          </label>
        ))}
      </div>
      {mode === "member" ? (
        <MemberPicker
          members={members}
          value={spouseMemberId || ""}
          onChange={(id) => onChange({ spouseMemberId: id, spouseName: "" })}
          placeholder="Search spouse in member list…"
          onClear={() => onChange({ spouseMemberId: "", spouseName: "" })}
        />
      ) : (
        <input
          value={spouseName || ""}
          onChange={(e) => onChange({ spouseMemberId: "", spouseName: e.target.value })}
          placeholder="Type spouse full name (not yet a member)"
        />
      )}
      {linked && mode === "member" && (
        <div style={{marginTop:5,fontSize:".72rem",color:"var(--green)",display:"flex",alignItems:"center",gap:5}}>
          ✅ Linked to: <strong>{linked.firstName} {linked.lastName}</strong>
          <span className="badge badge-full" style={{marginLeft:2}}>{linked.isFull?"Full":"Associate"}</span>
        </div>
      )}
      {!linked && spouseMemberId && mode === "member" && (
        <div style={{marginTop:5,fontSize:".72rem",color:"var(--red)"}}>⚠️ Member not found — please reselect</div>
      )}
    </div>
  );
}

const STORAGE_KEY = "pcea_ayubu_kinyua_db_v1";

function loadDb() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const parsed = JSON.parse(saved);
      // Merge: keep INITIAL_DATA structure but overlay saved data
      return { ...INITIAL_DATA, ...parsed };
    }
  } catch(e) { console.warn("Could not load saved data:", e); }
  return INITIAL_DATA;
}

function saveDb(db) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); }
  catch(e) { console.warn("Could not save data:", e); }
}

function Baptism({db,setDb,canWrite,setModal}){
const sorted=[…db.members].sort((a,b)=>new Date(a.baptismDate)-new Date(b.baptismDate));

reader.onload = ev => {
setDb(p => ({…p, members: p.members.map(m => m.id === memberId ? {…m, baptismCert: ev.target.result} : m)}));

};
reader.readAsDataURL(file);
};

</div>
</div>
))}
<button className=“btn btn-primary btn-sm” onClick={()=>{for(const u of users){if(!u.username||u.password.length<4){toast(“Username required & password min 4 chars”);return;}}setDb(p=>({…p,users}));toast(“Credentials saved ✅”);}}>Save All Credentials</button>
</div>
</div>
</>);
}

function ModalRouter({modal,setModal,db,setDb,canWrite}){
const close=()=>setModal(null);const{type,data}=modal;
if(type===“memberDetail”) return <MemberDetailModal member={data} db={db} setDb={setDb} canWrite={canWrite} close={close} setModal={setModal}/>;
if(type===“editMember”) return <EditMemberModal db={db} setDb={setDb} member={data} close={close}/>;
if(type===“districtDetail”) return <DistrictDetailModal district={data} db={db} close={close}/>;
if(type===“editDistrict”) return <EditDistrictModal db={db} setDb={setDb} district={data} close={close}/>;
if(type===“editGroup”) return <EditGroupModal db={db} setDb={setDb} group={data} close={close}/>;
if(type===“communionHistory”) return <CommunionHistoryModal member={data} close={close}/>;
if(type===“addCommunion”) return <AddCommunionModal db={db} setDb={setDb} close={close}/>;
if(type===“addRole”) return <AddRoleModal db={db} setDb={setDb} close={close} prefGroupId={data?.groupId}/>;
if(type===“addEvent”) return <AddEventModal db={db} setDb={setDb} close={close}/>;
if(type===“viewCert”) return <ViewCertModal member={data} close={close}/>;
if(type===“addTithe”) return <AddTitheModal db={db} setDb={setDb} prefMemberId={data?.memberId} close={close}/>;
if(type===“editLeaderRole”) return <EditLeaderRoleModal db={db} setDb={setDb} role={data?.role} close={close}/>;
if(type===“editElder”) return <EditElderModal db={db} setDb={setDb} elder={data} close={close}/>;
if(type===“editDeacon”) return <EditDeaconModal db={db} setDb={setDb} deacon={data} close={close}/>;
return null;
}

function MModal({title,close,children,footer}){
return(<div className="modal-overlay" onClick={close}><div className=“modal” onClick={e=>e.stopPropagation()}>
<div className="modal-header"><h3>{title}</h3><button className="close-btn" onClick={close}>×</button></div>
<div className="modal-body">{children}</div>
{footer&&<div className="modal-footer">{footer}</div>}

  </div></div>);
}

<div className="detail-item"><label>Contact</label><p>{m.contact}</p></div>

<div className="detail-item"><label>Membership</label><p><span className={`badge ${m.isFull?"badge-full":"badge-assoc"}`}>{m.isFull?“Full Member”:“Associate”}</span></p></div>

function EditMemberModal({db,setDb,member,close}){
const isNew=!member;
const [f,setF]=useState(member?{…member}:{firstName:””,lastName:””,otherNames:””,nationalId:””,contact:””,districtId:db.districts[0]?.id||””,isFull:false,baptismDate:””,confirmationDate:””,baptismCert:null,fatherName:””,motherName:””,familyId:””,photo:null,maritalStatus:“single”,spouseMemberId:””,spouseName:””});
const photoRef=useRef();
const set=(k,v)=>setF(p=>({…p,[k]:v}));
const handlePhoto=e=>{const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=ev=>set(“photo”,ev.target.result);r.readAsDataURL(file);};
const save = () => {
if (!f.firstName || !f.lastName || !f.nationalId || !f.contact) {
alert(“First Name, Last Name, National ID and Contact are required”);
return;
}
const memberData = {
…f,
isFull: !!f.isFull,
maritalStatus: f.maritalStatus || “single”,
spouseMemberId: f.spouseMemberId || “”,
spouseName: f.spouseName || “”,
};
if (isNew) {
const newId = generateId(“M”);
memberData.id = newId;
memberData.familyId = f.familyId || generateId(“FAM”);
memberData.communionRecords = [];
memberData.roles = [];
memberData.joinedYear = f.baptismDate ? new Date(f.baptismDate).getFullYear() : new Date().getFullYear();
setDb(p => {
let members = […p.members, memberData];
// Two-way link: update spouse’s record too
if (memberData.spouseMemberId) {
members = members.map(m => m.id === memberData.spouseMemberId
? { …m, spouseMemberId: newId, spouseName: “” }
: m
);
}
return { …p, members };
});
} else {
setDb(p => {
let members = p.members.map(m => m.id === memberData.id ? { …m, …memberData } : m);
// Two-way link: update spouse’s record too
if (memberData.spouseMemberId) {
members = members.map(m => m.id === memberData.spouseMemberId
? { …m, spouseMemberId: memberData.id, spouseName: “” }
: m
);
}
// If spouse was removed, clear the old spouse’s back-link
const oldMember = p.members.find(m => m.id === memberData.id);
if (oldMember && oldMember.spouseMemberId && oldMember.spouseMemberId !== memberData.spouseMemberId) {
members = members.map(m => m.id === oldMember.spouseMemberId
? { …m, spouseMemberId: “”, spouseName: “” }
: m
);
}
return { …p, members };
});
}
close();
};
const showSpouse = [“married”,“engaged”].includes(f.maritalStatus);
const spouseLabel = f.maritalStatus===“married” ? (f.spouseMemberId||f.spouseName ? (f.spouseMemberId?“Husband/Wife (linked)”:“Husband/Wife Name”) : “Husband / Wife”) : “Fiancé/Fiancée”;
return(<MModal title={isNew?“👤 Add New Member”:“✏️ Edit Member”} close={close} footer={<><button className="btn btn-outline" onClick={close}>Cancel</button><button className="btn btn-primary" onClick={save}>{isNew?“Save Member”:“Update Member”}</button></>}>
<div style={{display:“flex”,gap:11,marginBottom:11,alignItems:“center”}}>
<div className=“photo-upload” onClick={()=>photoRef.current.click()}>{f.photo?<img src={f.photo} alt=""/>:<span style={{color:“var(–muted)”,fontSize:“1.3rem”}}>📷</span>}</div>
<div style={{color:“var(–muted)”,fontSize:”.75rem”}}>Click to upload photo</div>
<input type=“file” accept=“image/*” ref={photoRef} style={{display:“none”}} onChange={handlePhoto}/>
</div>
<div className=“form-row” style={{gridTemplateColumns:“1fr 1fr 1fr”}}>
<div className="form-group"><label>First Name *</label><input value={f.firstName} onChange={e=>set(“firstName”,e.target.value)}/></div>
<div className="form-group"><label>Last Name *</label><input value={f.lastName} onChange={e=>set(“lastName”,e.target.value)}/></div>
<div className="form-group"><label>Other Names</label><input value={f.otherNames||””} onChange={e=>set(“otherNames”,e.target.value)}/></div>
</div>
<div className=“form-row” style={{gridTemplateColumns:“1fr 1fr”}}>
<div className="form-group"><label>National ID *</label><input value={f.nationalId} onChange={e=>set(“nationalId”,e.target.value)}/></div>
<div className="form-group"><label>Contact *</label><input value={f.contact} onChange={e=>set(“contact”,e.target.value)}/></div>
</div>
<div className=“form-row” style={{gridTemplateColumns:“1fr 1fr”}}>
<div className="form-group">
<label>District</label>
<DistrictPicker districts={db.districts} value={f.districtId} onChange={v=>set(“districtId”,v)} onClear={()=>set(“districtId”,””)}/>
</div>
<div className="form-group"><label>Membership Type</label><div style={{display:“flex”,gap:13,marginTop:6}}>{[“Associate”,“Full Member”].map((lbl,i)=><label key={lbl} style={{textTransform:“none”,fontSize:”.82rem”,display:“flex”,gap:5,alignItems:“center”}}><input type=“radio” name=“mt” checked={i===0?!f.isFull:f.isFull} onChange={()=>set(“isFull”,i===1)} style={{width:“auto”}}/>{lbl}</label>)}</div></div>
</div>
<div className=“form-row” style={{gridTemplateColumns:“1fr 1fr”}}>
<div className="form-group">
<label>Marital Status</label>
<select value={f.maritalStatus||“single”} onChange={e=>{set(“maritalStatus”,e.target.value);set(“spouseMemberId”,””);set(“spouseName”,””);}}>
{[“single”,“married”,“widowed”,“divorced”,“engaged”].map(s=><option key={s} value={s}>{s.charAt(0).toUpperCase()+s.slice(1)}</option>)}
</select>
</div>
<div className="form-group"><label>Baptism Date</label><input type=“date” value={f.baptismDate||””} onChange={e=>set(“baptismDate”,e.target.value)}/></div>
</div>
{showSpouse && (
<div className="form-group" style={{marginBottom:10}}>
<label>{spouseLabel}</label>
<SpouseField members={db.members.filter(m=>m.id!==f.id)} spouseMemberId={f.spouseMemberId||””} spouseName={f.spouseName||””} onChange={v=>setF(p=>({…p,…v}))}/>
</div>
)}
<div className=“form-row” style={{gridTemplateColumns:“1fr 1fr”}}>
<div className="form-group"><label>Confirmation Date</label><input type=“date” value={f.confirmationDate||””} onChange={e=>set(“confirmationDate”,e.target.value)}/></div>
<div className="form-group"><label>Family ID (links relatives)</label><input value={f.familyId||””} onChange={e=>set(“familyId”,e.target.value)} placeholder=“Leave blank to auto-generate”/></div>
</div>
<div className=“form-row” style={{gridTemplateColumns:“1fr 1fr”}}>
<div className="form-group"><label>Father’s Name</label><input value={f.fatherName||””} onChange={e=>set(“fatherName”,e.target.value)}/></div>
<div className="form-group"><label>Mother’s Name</label><input value={f.motherName||””} onChange={e=>set(“motherName”,e.target.value)}/></div>
</div>
</MModal>);
}

function AddTitheModal({db,setDb,prefMemberId,close}){
const MONTHS=[“January”,“February”,“March”,“April”,“May”,“June”,“July”,“August”,“September”,“October”,“November”,“December”];
const currentYear=new Date().getFullYear();
const [memberId,setMemberId]=useState(prefMemberId||””);
const [year,setYear]=useState(currentYear);
const [month,setMonth]=useState(MONTHS[new Date().getMonth()]);
const [amount,setAmount]=useState(””);
const save=()=>{
if(!memberId||!amount||isNaN(parseInt(amount))||parseInt(amount)<=0){alert(“Please select a member and enter a valid amount”);return;}
const entry={year:parseInt(year),month,amount:parseInt(amount)};
setDb(p=>({…p,members:p.members.map(m=>m.id===memberId?{…m,titheRecords:[…(m.titheRecords||[]),entry]}:m)}));
close();
};
return(<MModal title=“💰 Record Tithe” close={close} footer={<><button className="btn btn-outline" onClick={close}>Cancel</button><button className="btn btn-primary" onClick={save}>Save Record</button></>}>
<div className="form-group" style={{marginBottom:11}}>
<label>Member</label>
<MemberPicker members={db.members} value={memberId} onChange={setMemberId} placeholder=“Search member…” onClear={()=>setMemberId(””)}/>
</div>
<div className=“form-row” style={{gridTemplateColumns:“1fr 1fr 1fr”}}>
<div className="form-group"><label>Year</label>
<select value={year} onChange={e=>setYear(e.target.value)}>
{[currentYear,currentYear-1,currentYear-2,currentYear-3].map(y=><option key={y} value={y}>{y}</option>)}
</select>
</div>
<div className="form-group"><label>Month</label>
<select value={month} onChange={e=>setMonth(e.target.value)}>
{MONTHS.map(m=><option key={m} value={m}>{m}</option>)}
</select>
</div>
<div className="form-group"><label>Amount (KES)</label>
<input type=“number” value={amount} onChange={e=>setAmount(e.target.value)} placeholder=“e.g. 1000” min=“1”/>
</div>
</div>
</MModal>);
}

const elder=db.leadership.elders.find(e=>e.districtId===district.id);
const deacons=db.leadership.deacons.filter(e=>e.districtId===district.id);
return(<MModal title={`🗺 ${district.name}`} close={close} footer={<button className="btn btn-outline" onClick={close}>Close</button>}>
<div className="org-row" style={{marginBottom:13}}>
{elder&&<div className="leader-box elder"><div className="title">Elder (District Leader)</div><div className="name">{elder.name}</div></div>}
{deacons.map(dc=><div key={dc.memberId} className="leader-box deacon"><div className="title">Deacon — {dc.role}</div><div className="name">{dc.name}</div></div>)}

<div style={{fontFamily:“Cormorant Garamond,serif”,color:“var(–gold)”,margin:“12px 0 6px”}}>Members ({members.length})</div>

</MModal>);

function EditDistrictModal({db,setDb,district,close}){

return(<MModal title={isNew?“➕ Add District”:“✏️ Edit District”} close={close} footer={<><button className="btn btn-outline" onClick={close}>Cancel</button><button className="btn btn-primary" onClick={save}>{isNew?“Add District”:“Update”}</button></>}>
<div className="form-group"><label>District Name</label><input value={name} onChange={e=>setName(e.target.value)} placeholder=“e.g. Zion District”/></div>
</MModal>);
}

function EditGroupModal({db,setDb,group,close}){
const isNew=!group;const [name,setName]=useState(group?.name||””);
const save=()=>{if(!name.trim()){alert(“Name required”);return;}if(isNew)setDb(p=>({…p,groups:[…p.groups,{id:generateId(“G”),name:name.trim()}]}));else setDb(p=>({…p,groups:p.groups.map(g=>g.id===group.id?{…g,name:name.trim()}:g)}));close();};
return(<MModal title={isNew?“➕ Add Group”:“✏️ Edit Group”} close={close} footer={<><button className="btn btn-outline" onClick={close}>Cancel</button><button className="btn btn-primary" onClick={save}>{isNew?“Add Group”:“Update”}</button></>}>
<div className="form-group"><label>Group Name</label><input value={name} onChange={e=>setName(e.target.value)} placeholder=“e.g. Youth Fellowship”/></div>
</MModal>);
}

function CommunionHistoryModal({member:m,close}){
return(<MModal title={`🍷 ${m.firstName} ${m.lastName} — Communion History`} close={close} footer={<button className="btn btn-outline" onClick={close}>Close</button>}>
<p style={{marginBottom:11,color:“var(–muted)”}}>Total: <strong style={{color:“var(–gold)”,fontSize:“1.5rem”}}>{m.communionRecords.length}</strong></p>
{m.communionRecords.length?<div className="table-wrap"><table><thead><tr><th>#</th><th>Date</th><th>Service</th></tr></thead><tbody>{[…m.communionRecords].reverse().map((r,i)=><tr key={i}><td style={{color:“var(–muted)”}}>{m.communionRecords.length-i}</td><td>{formatDate(r.date)}</td><td>{r.service}</td></tr>)}</tbody></table></div>:<p style={{color:“var(–muted)”}}>No records yet.</p>}

function AddCommunionModal({db,setDb,close}){
const [memberId,setMemberId]=useState(””);const [date,setDate]=useState(””);const [service,setService]=useState(””);
const save=()=>{if(!memberId||!date||!service){alert(“All fields required”);return;}setDb(p=>({…p,members:p.members.map(m=>m.id===memberId?{…m,communionRecords:[…m.communionRecords,{date,service}]}:m)}));close();};
return(<MModal title=“🍷 Record Communion” close={close} footer={<><button className="btn btn-outline" onClick={close}>Cancel</button><button className="btn btn-primary" onClick={save}>Save Record</button></>}>

<label>Member (Full Members only)</label>

</div>
<div className="form-group" style={{marginBottom:10}}><label>Date</label><input type=“date” value={date} onChange={e=>setDate(e.target.value)}/></div>
<div className="form-group"><label>Service Name</label><input value={service} onChange={e=>setService(e.target.value)} placeholder=“e.g. Easter Communion…”/></div>
</MModal>);
}

function AddRoleModal({db,setDb,close,prefGroupId}){
const [memberId,setMemberId]=useState(””);const [groupId,setGroupId]=useState(prefGroupId||””);const [role,setRole]=useState(””);
const [from,setFrom]=useState(””);const [to,setTo]=useState(””);
const save=()=>{
if(!memberId||!groupId||!role){alert(“All fields required”);return;}
const mObj=db.members.find(m=>m.id===memberId);
const fullName=mObj?`${mObj.firstName} ${mObj.lastName}`:””;
setDb(p=>({…p,members:p.members.map(m=>m.id===memberId?{…m,roles:[…m.roles,{groupId,role,from,to}]}:m),leadership:{…p.leadership,groupLeaders:[…p.leadership.groupLeaders,{groupId,role,memberId,name:fullName}]}}));
close();
};
const groupOptions=db.groups.map(g=>({value:g.id,label:g.name}));
return(<MModal title=“🤝 Assign Group Role” close={close} footer={<><button className="btn btn-outline" onClick={close}>Cancel</button><button className="btn btn-primary" onClick={save}>Assign Role</button></>}>
<div className="form-group" style={{marginBottom:10}}>
<label>Member</label>
<MemberPicker members={db.members} value={memberId} onChange={setMemberId} placeholder=“Search member…” onClear={()=>setMemberId(””)}/>
</div>
<div className="form-group" style={{marginBottom:10}}>
<label>Group</label>
<SearchableSelect value={groupId} onChange={setGroupId} options={groupOptions} placeholder=“Search group…” onClear={()=>setGroupId(””)} renderOption={o=><span>🤝 {o.label}</span>}/>
</div>
<div className="form-group" style={{marginBottom:10}}><label>Role</label><input value={role} onChange={e=>setRole(e.target.value)} placeholder=“e.g. President, Secretary…”/></div>
<div className=“form-row” style={{gridTemplateColumns:“1fr 1fr”}}>
<div className="form-group"><label>From (Date Started)</label><input type=“date” value={from} onChange={e=>setFrom(e.target.value)}/></div>
<div className="form-group"><label>To (Date Ended — leave blank if ongoing)</label><input type=“date” value={to} onChange={e=>setTo(e.target.value)}/></div>
</div>
</MModal>);
}

function AddEventModal({db,setDb,close}){

const set=(k,v)=>setF(p=>({…p,[k]:v}));

<div className=“form-row” style={{gridTemplateColumns:“1fr 1fr 1fr”}}><div className="form-group"><label>Date *</label><input type=“date” value={f.date} onChange={e=>set(“date”,e.target.value)}/></div><div className="form-group"><label>Start Time</label><input type=“time” value={f.time} onChange={e=>set(“time”,e.target.value)}/></div><div className="form-group"><label>End Time</label><input type=“time” value={f.endTime} onChange={e=>set(“endTime”,e.target.value)}/></div></div>
<div className=“form-row” style={{gridTemplateColumns:“1fr 1fr”}}><div className="form-group"><label>Type</label><select value={f.type} onChange={e=>set(“type”,e.target.value)}>{Object.entries(EVENT_LABELS).map(([k,v])=><option key={k} value={k}>{v}</option>)}</select></div><div className="form-group"><label>Language</label><select value={f.language} onChange={e=>set(“language”,e.target.value)}>{[“English”,“Kiswahili”,“Both”].map(l=><option key={l}>{l}</option>)}</select></div></div>
<div className=“form-row” style={{gridTemplateColumns:“1fr 1fr”}}>
<div className="form-group"><label>Leading District</label><DistrictPicker districts={db.districts} value={f.leadDistrict} onChange={v=>set(“leadDistrict”,v)} onClear={()=>set(“leadDistrict”,””)}/></div>
<div className="form-group"><label>Leading Group</label><SearchableSelect value={f.leadGroup} onChange={v=>set(“leadGroup”,v)} options={db.groups.map(g=>({value:g.id,label:g.name}))} placeholder=“Search group…” onClear={()=>set(“leadGroup”,””)} renderOption={o=><span>🤝 {o.label}</span>}/></div>
</div>
<div className="form-group" style={{marginBottom:9}}><label>Description</label><textarea value={f.description} onChange={e=>set(“description”,e.target.value)} rows={2}/></div>
<label style={{display:“flex”,gap:6,alignItems:“center”,fontSize:”.79rem”,textTransform:“none”,cursor:“pointer”}}><input type=“checkbox” checked={f.recurring} onChange={e=>set(“recurring”,e.target.checked)} style={{width:“auto”}}/>Recurring event</label>
</MModal>);
}

function EditLeaderRoleModal({db,setDb,role,close}){
const L=db.leadership;
const [f,setF]=useState(
role===“moderator”?{memberId:L.moderator.memberId||””,title:L.moderator.title,name:L.moderator.name,since:L.moderator.since}:
role===“sessionClerk”?{memberId:L.sessionClerk.memberId||””,name:L.sessionClerk.name,since:L.sessionClerk.since}:
{
cpMemberId:L.lcc.chairperson.memberId||””,cpName:L.lcc.chairperson.name,cpSince:L.lcc.chairperson.since,
secMemberId:L.lcc.secretary.memberId||””,secName:L.lcc.secretary.name,secSince:L.lcc.secretary.since,
trMemberId:L.lcc.treasurer.memberId||””,trName:L.lcc.treasurer.name,trSince:L.lcc.treasurer.since,
}
);
const set=(k,v)=>setF(p=>({…p,[k]:v}));
const pickMember=(idKey,nameKey)=>(id)=>{const m=db.members.find(x=>x.id===id);set(idKey,id);if(m)set(nameKey,`${m.firstName} ${m.lastName}`);};
const save=()=>{
if(role===“moderator”)setDb(p=>({…p,leadership:{…p.leadership,moderator:{…p.leadership.moderator,…f}}}));
else if(role===“sessionClerk”)setDb(p=>({…p,leadership:{…p.leadership,sessionClerk:{…p.leadership.sessionClerk,memberId:f.memberId,name:f.name,since:f.since}}}));
else setDb(p=>({…p,leadership:{…p.leadership,lcc:{chairperson:{…p.leadership.lcc.chairperson,memberId:f.cpMemberId,name:f.cpName,since:f.cpSince},secretary:{…p.leadership.lcc.secretary,memberId:f.secMemberId,name:f.secName,since:f.secSince},treasurer:{…p.leadership.lcc.treasurer,memberId:f.trMemberId,name:f.trName,since:f.trSince}}}}));
close();
};
const title=role===“moderator”?“Edit Moderator”:role===“sessionClerk”?“Edit Session Clerk”:“Edit LCC Executive”;
return(<MModal title={`✏️ ${title}`} close={close} footer={<><button className="btn btn-outline" onClick={close}>Cancel</button><button className="btn btn-primary" onClick={save}>Update</button></>}>
<p style={{fontSize:”.78rem”,color:“var(–gold)”,marginBottom:11}}>✝ All leaders must first be registered members of the congregation.</p>
{role===“moderator”&&<>
<div className="form-group" style={{marginBottom:9}}><label>Select Member *</label><MemberPicker members={db.members} value={f.memberId} onChange={pickMember(“memberId”,“name”)} placeholder=“Search member…” onClear={()=>set(“memberId”,””)}/></div>
<div className=“form-row” style={{gridTemplateColumns:“1fr 2fr”}}><div className="form-group"><label>Title</label><input value={f.title} onChange={e=>set(“title”,e.target.value)} placeholder=“Rev.”/></div><div className="form-group"><label>Display Name</label><input value={f.name} onChange={e=>set(“name”,e.target.value)}/></div></div>
<div className="form-group"><label>Since</label><input type=“date” value={f.since||””} onChange={e=>set(“since”,e.target.value)}/></div>
</>}
{role===“sessionClerk”&&<>
<div className="form-group" style={{marginBottom:9}}><label>Select Member *</label><MemberPicker members={db.members} value={f.memberId} onChange={pickMember(“memberId”,“name”)} placeholder=“Search member…” onClear={()=>set(“memberId”,””)}/></div>
<div className="form-group" style={{marginBottom:9}}><label>Display Name</label><input value={f.name} onChange={e=>set(“name”,e.target.value)}/></div>
<div className="form-group"><label>Since</label><input type=“date” value={f.since||””} onChange={e=>set(“since”,e.target.value)}/></div>
</>}
{role===“lcc”&&[
{lbl:“Chairperson”,mk:“cpMemberId”,nk:“cpName”,sk:“cpSince”},
{lbl:“Secretary”,mk:“secMemberId”,nk:“secName”,sk:“secSince”},
{lbl:“Treasurer”,mk:“trMemberId”,nk:“trName”,sk:“trSince”},
].map(x=>(
<div key={x.lbl} style={{marginBottom:13,paddingBottom:11,borderBottom:“1px solid var(–border)”}}>
<div style={{fontFamily:“Cormorant Garamond,serif”,color:“var(–gold)”,marginBottom:7}}>{x.lbl}</div>
<div className="form-group" style={{marginBottom:8}}><label>Select Member *</label><MemberPicker members={db.members} value={f[x.mk]} onChange={id=>{const m=db.members.find(z=>z.id===id);set(x.mk,id);if(m)set(x.nk,`${m.firstName} ${m.lastName}`);}} placeholder=“Search member…” onClear={()=>set(x.mk,””)}/></div>
<div className=“form-row” style={{gridTemplateColumns:“2fr 1fr”}}><div className="form-group"><label>Display Name</label><input value={f[x.nk]||””} onChange={e=>set(x.nk,e.target.value)}/></div><div className="form-group"><label>Since</label><input type=“date” value={f[x.sk]||””} onChange={e=>set(x.sk,e.target.value)}/></div></div>
</div>
))}
</MModal>);
}

function EditElderModal({db,setDb,elder,close}){
const isNew=!elder;
const [f,setF]=useState(elder?{memberId:elder.memberId,name:elder.name,districtId:elder.districtId,since:elder.since}:{memberId:””,name:””,districtId:db.districts[0]?.id||””,since:””});
const set=(k,v)=>setF(p=>({…p,[k]:v}));
const save=()=>{
if(!f.memberId||!f.districtId){alert(“Please select a member and district”);return;}
const entry={memberId:f.memberId,name:f.name,districtId:f.districtId,since:f.since};
if(isNew)setDb(p=>({…p,leadership:{…p.leadership,elders:[…p.leadership.elders,entry]}}));
else setDb(p=>({…p,leadership:{…p.leadership,elders:p.leadership.elders.map((e,i)=>i===elder.idx?entry:e)}}));
close();
};
return(<MModal title={isNew?“➕ Add Elder”:“✏️ Edit Elder”} close={close} footer={<><button className="btn btn-outline" onClick={close}>Cancel</button><button className="btn btn-primary" onClick={save}>{isNew?“Add Elder”:“Update”}</button></>}>
<p style={{fontSize:”.78rem”,color:“var(–gold)”,marginBottom:10}}>⚖ Elders must first be registered members of the congregation.</p>
<div className="form-group" style={{marginBottom:10}}>
<label>Select Member *</label>
<MemberPicker members={db.members} value={f.memberId} onChange={id=>{const m=db.members.find(x=>x.id===id);set(“memberId”,id);if(m)set(“name”,`${m.firstName} ${m.lastName}`);}} placeholder=“Search member…” onClear={()=>set(“memberId”,””)}/>
</div>
<div className="form-group" style={{marginBottom:10}}>
<label>District *</label>
<DistrictPicker districts={db.districts} value={f.districtId} onChange={v=>set(“districtId”,v)} onClear={()=>set(“districtId”,””)}/>
</div>
<div className="form-group"><label>Date Appointed</label><input type=“date” value={f.since||””} onChange={e=>set(“since”,e.target.value)}/></div>
</MModal>);
}

</MModal>);
}
