<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#c9a84c;--gold2:#e8c97a;--deep:#0d1f35;--mid:#1a3352;--bg:#0a1628;--sur:#111e30;--sur2:#162540;--bor:#1e3254;--txt:#e8e4dc;--mut:#8a9ab5;--grn:#27ae60;--blu:#2980b9;--red:#c0392b;--sw:258px}
body.light{--deep:#f0f4ff;--mid:#e0e8f8;--bg:#f8faff;--sur:#ffffff;--sur2:#eef2fb;--bor:#c8d4e8;--txt:#1a2540;--mut:#6070a0;--gold:#b8922a;--gold2:#d4a83c}
body.light .ni{color:var(--mut)}
body.light .ni.on{color:var(--gold)}
body.light input,body.light select,body.light textarea{color:var(--txt);background:var(--sur2)}
html,body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
h1,h2,h3,h4{font-family:Georgia,'Times New Roman',serif}
#app{display:flex;min-height:100vh}
#sb{width:var(--sw);min-width:var(--sw);background:var(--deep);border-right:1px solid var(--bor);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;overflow-y:auto;z-index:200;transition:transform .3s}
#mn{flex:1;margin-left:var(--sw);overflow-y:auto;min-height:100vh}
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:190}
.ov.on{display:block}
.slogo{padding:13px 12px;border-bottom:1px solid var(--bor);display:flex;align-items:center;gap:9px}
.slogo img{width:44px;height:52px;object-fit:contain;flex-shrink:0;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))}
.slogo h2{font-size:.9rem;color:var(--gold);line-height:1.2}
.slogo p{font-size:.57rem;color:var(--mut);margin-top:2px;line-height:1.4}
.nsec{padding:4px 0}
.nlbl{font-size:.57rem;letter-spacing:2px;text-transform:uppercase;color:var(--mut);padding:5px 14px 2px}
.ni{display:flex;align-items:center;gap:8px;padding:8px 14px;cursor:pointer;color:var(--mut);font-size:.81rem;border-left:3px solid transparent;transition:all .18s;white-space:nowrap}
.ni:hover{background:var(--mid);color:var(--txt)}
.ni.on{background:var(--mid);color:var(--gold);border-left-color:var(--gold)}
.ubadge{margin-top:auto;padding:10px 13px;border-top:1px solid var(--bor);font-size:.74rem}
.urole{color:var(--gold);font-size:.61rem;letter-spacing:1px;text-transform:uppercase}
#tb{display:none;align-items:center;justify-content:space-between;padding:10px 13px;background:linear-gradient(135deg,var(--deep),var(--mid));border-bottom:1px solid var(--bor);position:sticky;top:0;z-index:150;box-shadow:0 2px 8px rgba(0,0,0,.2)}
#tb span{font-family:Georgia,serif;color:var(--gold);font-size:.9rem}
.hbtn{background:none;border:none;color:var(--gold);font-size:1.4rem;cursor:pointer;padding:2px 5px}
.ph{padding:18px 22px 13px;border-bottom:1px solid var(--bor);background:linear-gradient(135deg,var(--sur) 0%,var(--sur2) 100%)}
.ph h2{font-size:1.6rem;color:var(--gold)}
.ph p{color:var(--mut);font-size:.78rem;margin-top:3px}
.con{padding:18px 22px}
.card{background:var(--sur);border:1px solid var(--bor);border-radius:10px;padding:16px;margin-bottom:13px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:5px}
.ct{font-size:1rem;color:var(--gold);font-family:Georgia,serif}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sb{background:linear-gradient(135deg,var(--sur2),var(--sur));border:1px solid var(--bor);border-radius:10px;padding:14px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.15);transition:transform .2s}.sb:hover{transform:translateY(-2px)}
.sn{font-size:1.8rem;font-family:Georgia,serif;color:var(--gold);font-weight:700}
.sl{font-size:.66rem;color:var(--mut);letter-spacing:1px;text-transform:uppercase;margin-top:2px}
.sd{font-size:.67rem;color:var(--grn);margin-top:2px}
.mc{background:var(--sur2);border:1px solid var(--bor);border-radius:8px;padding:11px;cursor:pointer;transition:all .18s}
.mc:hover{border-color:var(--gold);transform:translateY(-1px)}
.av{border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-family:Arial,sans-serif;font-weight:700;color:#fff;flex-shrink:0;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.b{display:inline-block;font-size:.6rem;padding:3px 8px;border-radius:20px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.bf{background:rgba(39,174,96,.15);color:#27ae60;border:1px solid rgba(39,174,96,.3)}
.ba{background:rgba(192,57,43,.15);color:#e74c3c;border:1px solid rgba(192,57,43,.3)}
.bg{background:rgba(201,168,76,.15);color:var(--gold);border:1px solid rgba(201,168,76,.3)}

table{width:100%;border-collapse:collapse;font-size:.79rem;min-width:400px}
th{text-align:left;padding:7px 9px;color:var(--mut);font-size:.62rem;letter-spacing:1.5px;text-transform:uppercase;border-bottom:1px solid var(--bor);font-weight:500}

input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,168,76,.15);outline:none}
select option{background:var(--deep)}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:300;display:flex;align-items:center;justify-content:center;padding:12px}
.md{background:var(--deep);border:1px solid var(--bor);border-radius:14px;width:100%;max-width:620px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.5)}

.mb{padding:17px}
.mf{padding:10px 17px;border-top:1px solid var(--bor);display:flex;gap:7px;justify-content:flex-end;position:sticky;bottom:0;background:var(--deep)}
.xb{background:none;border:none;color:var(--mut);font-size:1.3rem;cursor:pointer}
.lw{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg)}
.lb{background:var(--sur);border:1px solid var(--bor);border-radius:16px;padding:32px 28px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.4)}

.cf{background:linear-gradient(90deg,var(--gold),var(--gold2));height:100%}

.dc{background:var(--sur2);border:1px solid var(--bor);border-radius:8px;padding:12px;cursor:pointer;transition:border-color .18s}

.tabs{display:flex;border-bottom:1px solid var(--bor);margin-bottom:13px;overflow-x:auto}
.tab{padding:6px 12px;cursor:pointer;font-size:.78rem;color:var(--mut);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab.on{color:var(--gold);border-bottom-color:var(--gold)}

@media(max-width:560px){.g2,.g3,.g4{grid-template-columns:1fr}table{font-size:.72rem}th,td{padding:5px 6px}.md{max-width:100%}}

function loadDb(){try{var s=localStorage.getItem(SK);if(s){var p=JSON.parse(s);return Object.assign({},INITIAL_DATA,p);}}catch(e){}return JSON.parse(JSON.stringify(INITIAL_DATA));}
function saveDb(){try{localStorage.setItem(SK,JSON.stringify(db));}catch(e){}}

// ── THEME ──────────────────────────────────────────────────────────────────
function initTheme(){
  var t=localStorage.getItem('pcea_theme')||'dark';
  if(t==='light')document.body.classList.add('light');
}
function toggleTheme(){
  document.body.classList.toggle('light');
  var t=document.body.classList.contains('light')?'light':'dark';
  localStorage.setItem('pcea_theme',t);
  var btn=document.getElementById('theme-btn');
  if(btn)btn.textContent=t==='light'?'Dark Mode':'Light Mode';
}

// ── ACTIVITY LOG ──────────────────────────────────────────────────────────
function logActivity(action,detail){
  if(!session)return;
  if(!db.activityLog)db.activityLog=[];
  db.activityLog.unshift({
    ts:new Date().toISOString(),
    user:session.displayName,
    role:session.role,
    action:action,
    detail:detail||''
  });
  if(db.activityLog.length>200)db.activityLog=db.activityLog.slice(0,200);
  saveDb();
}

function ini(m){return((m.firstName||'')[0]||'?').toUpperCase()+((m.lastName||'')[0]||'').toUpperCase();}
function fd(d){if(!d)return'-';try{return new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});}catch(e){return d;}}
function esc(s){return String(s||'').replace(/&/g,'and').replace(/</g,'(').replace(/>/g,')').replace(/"/g,"'");}
function gid(p){return p+Date.now().toString().slice(-6)+Math.floor(Math.random()*99);}
function cw(){return session&&['secretary','moderator','session_clerk'].indexOf(session.role)>=0;}
function getAge(m){if(!m.yearOfBirth)return null;return new Date().getFullYear()-parseInt(m.yearOfBirth);}
function ageCategory(m){var a=getAge(m);if(a===null)return'Unknown';if(a<=10)return'Sunday School (1-10)';if(a<=17)return'Bridge (11-17)';if(a<=35)return'Youth (18-35)';return'Adult (36+)';}
function ageCategoryShort(m){var a=getAge(m);if(a===null)return'-';if(a<=10)return'Sunday School';if(a<=17)return'Bridge';if(a<=35)return'Youth';return'Adult';}
function avHtml(m,sz){sz=sz||42;return '<div class="av" style="background:'+ac(m.id)+';width:'+sz+'px;height:'+sz+'px;font-size:'+Math.round(sz*0.38)+'px">'+ini(m)+'</div>';}


function importMembersExcel(){
  var inp=document.createElement('input');
  inp.type='file';
  inp.accept='.xlsx,.xls,.csv';
  inp.onchange=function(e){
    var file=e.target.files[0];if(!file)return;
    var reader=new FileReader();
    reader.onload=function(ev){
      try{
        var wb=XLSX.read(ev.target.result,{type:'binary'});
        var ws=wb.Sheets[wb.SheetNames[0]];
        var rows=XLSX.utils.sheet_to_json(ws,{defval:''});
        if(!rows.length){alert('No data found in Excel file');return;}
        
        var added=0,skipped=0;
        rows.forEach(function(row){
          // Accept common column name variations
          var fn=(row['First Name']||row['FirstName']||row['first_name']||'').toString().trim();
          var ln=(row['Last Name']||row['LastName']||row['last_name']||'').toString().trim();
          var nid=(row['National ID']||row['NationalID']||row['national_id']||row['ID']||'').toString().trim();
          var ct=(row['Contact']||row['Phone']||row['Mobile']||'').toString().trim();
          var dist=(row['District']||'').toString().trim();
          var status=(row['Status']||row['Membership']||'').toString().toLowerCase().trim();
          var bdate=(row['Baptism Date']||row['BaptismDate']||'').toString().trim();
          var yob=parseInt(row['Year of Birth']||row['YearOfBirth']||row['DOB']||0)||'';
          var marital=(row['Marital Status']||row['MaritalStatus']||'single').toString().toLowerCase().trim();
          var father=(row['Father']||row["Father's Name"]||'').toString().trim();
          var mother=(row['Mother']||row["Mother's Name"]||'').toString().trim();
          var other=(row['Other Names']||row['OtherNames']||'').toString().trim();
          
          if(!fn||!ln){skipped++;return;}
          
          // Match district by name
          var distObj=db.districts.find(function(d){return d.name.toLowerCase().indexOf(dist.toLowerCase())>=0;});
          var distId=distObj?distObj.id:db.districts[0].id;
          
          var isFull=status==='full'||status==='full member';
          
          db.members.push({
            id:gid('M'),firstName:fn,lastName:ln,otherNames:other,
            nationalId:nid||'KE-'+Math.floor(Math.random()*9000000+1000000),
            contact:ct,districtId:distId,isFull:isFull,
            baptismDate:bdate||'',confirmationDate:'',baptismCert:null,
            fatherName:father,motherName:mother,
            familyId:gid('FAM'),maritalStatus:marital||'single',
            spouseMemberId:'',spouseName:'',yearOfBirth:yob,
            roles:[],communionRecords:[],titheRecords:[],photo:null,
            joinedYear:bdate?new Date(bdate).getFullYear():new Date().getFullYear()
          });
          added++;
        });
        
        saveDb();
        logActivity('IMPORT','Imported '+added+' members from Excel ('+(skipped?skipped+' skipped':'all added')+')');
        rerender();
        alert('Import complete! '+added+' members added'+(skipped?' ('+skipped+' rows skipped - missing name)':'')+'.');
      }catch(err){
        alert('Error reading Excel file: '+err.message+'\nMake sure it has columns: First Name, Last Name, Contact, District, Status');
      }
    };
    reader.readAsBinaryString(file);
  };
  inp.click();
}

function memberGrid(){
  var q=(_ms||'').toLowerCase(),filt=_mf||'all',distF=_md||'all';
  var filtered=db.members.filter(function(m){
    var t=(m.firstName+' '+m.lastName+' '+(m.otherNames||'')+' '+m.nationalId+' '+m.contact).toLowerCase();
    var a=getAge(m);
    var ageOk=filt==='all'||(filt==='full'&&m.isFull)||(filt==='assoc'&&!m.isFull)||(filt==='ss'&&a!==null&&a<=10)||(filt==='bridge'&&a!==null&&a>=11&&a<=17)||(filt==='youth'&&a!==null&&a>=18&&a<=35);
    return t.indexOf(q)>=0&&ageOk&&(distF==='all'||m.districtId===distF);
  });
  if(!filtered.length)return '<p style="color:var(--mut);grid-column:1/-1">No members found.</p>';
  return filtered.map(function(m){
    var dist=db.districts.find(function(d){return d.id===m.districtId;});
    return '<div class="mc"><div style="display:flex;gap:8px;align-items:center;cursor:pointer" onclick="openModal(\'memberDetail\',\''+m.id+'\')">'+avHtml(m)+'<div><div style="font-size:.89rem;font-family:Georgia,serif;font-weight:600">'+esc(m.firstName)+' '+(m.otherNames?esc(m.otherNames)+' ':'')+esc(m.lastName)+'</div><div style="font-size:.69rem;color:var(--mut)">'+esc(m.nationalId)+'</div></div></div>'+
      '<div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:6px">'+

    p.push('<div class="sec"><h3>Holy Communion ('+comRecs.length+' total)</h3>');
    p.push('<table><thead><tr><th>#</th><th>Date</th><th>Service</th></tr></thead><tbody>');
    var revCom=comRecs.slice().reverse().slice(0,10);
    for(var ci=0;ci<revCom.length;ci++){
      p.push('<tr><td>'+(comRecs.length-ci)+'</td><td>'+fd(revCom[ci].date)+'</td><td>'+revCom[ci].service+'</td></tr>');
    }
    p.push('</tbody></table>');
    if(comRecs.length>10)p.push('<p style="font-size:11px;color:#888;margin-top:5px">Showing last 10 of '+comRecs.length+' records.</p>');
    p.push('</div>');
  }

  // Tithe
  if(titheTotal>0){
    p.push('<div class="sec"><h3>Tithe Summary</h3>');
    p.push('<div style="background:#f0f4ff;border:2px solid #1a3a5c;border-radius:8px;padding:12px 16px;display:inline-block;margin-bottom:10px">');
    p.push('<div style="font-size:11px;color:#888;text-transform:uppercase;letter-spacing:1px">Total Contributions</div>');
    p.push('<div style="font-size:22px;font-weight:bold;color:#1a3a5c">KES '+titheTotal.toLocaleString()+'</div>');
    p.push('<div style="font-size:11px;color:#888">'+((m.titheRecords||[]).length)+' entries recorded</div>');
    p.push('</div>');
    if((m.titheRecords||[]).length>0){
      p.push('<table><thead><tr><th>Year</th><th>Month</th><th>Amount (KES)</th></tr></thead><tbody>');
      var revTithe=(m.titheRecords||[]).slice().reverse();
      for(var ti3=0;ti3<revTithe.length;ti3++){
        p.push('<tr><td>'+revTithe[ti3].year+'</td><td>'+revTithe[ti3].month+'</td><td>'+revTithe[ti3].amount.toLocaleString()+'</td></tr>');
      }
      p.push('</tbody></table>');
    }
    p.push('</div>');
  }

  p.push('<div class="foot"><p>PCEA Ayubu Kinyua Congregation - Eldoret | Faith - Love - Hope</p><p>Printed on '+new Date().toLocaleDateString()+'</p></div>');
  p.push('</body></html>');

  var w=window.open('','_blank');
  if(!w){alert('Allow pop-ups to print.');return;}
  w.document.write(p.join(''));
  w.document.close();
  w.focus();
  setTimeout(function(){w.print();},500);
}

function saveGroupRep(gid2){
  var distId=document.getElementById('agrd').value,pos=document.getElementById('agrp').value,mid=document.getElementById('agrm').value,from=document.getElementById('agrf').value||'';
  if(!distId||!pos||!mid){alert('All fields required');return;}
  var m=db.members.find(function(x){return x.id===mid;});
  if(m.districtId!==distId&&!confirm('Member is not from this district. Assign anyway?'))return;
  db.members.forEach(function(x){if(x.id!==mid)x.roles=(x.roles||[]).filter(function(r){return !(r.groupId===gid2&&r.role===pos&&r.districtRep===distId);});});
  if(!m.roles)m.roles=[];
  m.roles=m.roles.filter(function(r){return !(r.groupId===gid2&&r.role===pos);});
  m.roles.push({groupId:gid2,role:pos,districtRep:distId,from:from,to:''});
  db.leadership.groupLeaders=db.leadership.groupLeaders.filter(function(gl){return !(gl.groupId===gid2&&gl.role===pos&&gl.districtId===distId);});
  db.leadership.groupLeaders.push({groupId:gid2,role:pos,memberId:mid,name:m.firstName+' '+m.lastName,districtId:distId});
  saveDb();closeModal();rerender();
}
